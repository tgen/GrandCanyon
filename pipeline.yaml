task_variables:
  umi_options:
    correct_umi_umi_files: /home/tgenref/assay_files/twist_umi_adaptor_system/known_umi_sequences.txt
    correct_umi_max_mismatches: 1
    correct_umi_min_distance: 2
    correct_umi_read_structure: "5M2S+T 5M2S+T"
    group_reads_edits: 1
    group_reads_min_map_q: 1
    group_reads_strategy: "paired"
    consensus_error_rate_pre_umi: 45
    consensus_error_rate_post_umi: 40
    consensus_min_input_base_quality: 10
    filter_min_reads: 1
    filter_min_base_quality: 30
    filter_max_no_call_fraction: 0.1
    filter_max_base_error_rate: 0.1
  somatic_variant_filtering:
    genome:
      vcfmerger_exclude_filter: "(FMT/DP<10 | FMT/AR[0]>=0.02 | FMT/AR[1]<0.05)"
    exome:
      vcfmerger_exclude_filter: "(FMT/DP<10 | FMT/AR[0]>=0.02 | FMT/AR[1]<0.05)"
  tumor_only_variant_filtering:
    genome:
      COSMIC_Ratio_Threshold: 0.10
      vcfmerger_exclude_filter: "(FMT/DP<10 | FMT/AR[0]>=0.02 | FMT/AR[1]<0.05)"
    exome:
      COSMIC_Ratio_Threshold: 0.10
      vcfmerger_exclude_filter: "(FMT/DP<10 | FMT/AR[0]>=0.02 | FMT/AR[1]<0.05)"
  cnvear_copy_number_thresholds:
    genome:
      high_gain: 1.32
      gain: 0.16
      het_loss: -0.16
      hom_loss: -1.32
    exome:
      high_gain: 1.32
      gain: 0.16
      het_loss: -0.16
      hom_loss: -1.32
  read_trimming:
    genome:
      n_base_limit: 5
      length_required: 75
      qualified_quality_phred: 15
      unqualified_percent_limit: 40
      trim_poly_g: true
      trim_poly_g_by_percent: true
      poly_g_percent: 0.85
      trim_poly_g_read2only: true
    exome:
      n_base_limit: 5
      length_required: 75
      qualified_quality_phred: 15
      unqualified_percent_limit: 40
      trim_poly_g: true
      trim_poly_g_by_percent: true
      poly_g_percent: 0.85
      trim_poly_g_read2only: true
    rna:
      n_base_limit: 5
      length_required: 25
      qualified_quality_phred: 15
      unqualified_percent_limit: 40
